name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pack
        shell: pwsh
        run: choco pack filee/filee.nuspec --outputdirectory dist

      - name: Install and uninstall
        shell: pwsh
        run: ./scripts/test.ps1 -Source dist

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/*.nupkg
